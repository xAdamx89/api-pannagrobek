[tool.poetry]
name = "api-pannagrobek"
version = "0.1.0"
description = "Api dla mojej apliakcji Flet pannagrobek"
authors = ["Adam Mazurek <adammazurek89@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = {extras = ["standard"], version = "^0.162.0"}
sqlalchemy = "^2.1.6"
psycopg2-binary = "^2.9.13"
psycopg = {extras = ["binary"], version = "^3.3.6"}


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
