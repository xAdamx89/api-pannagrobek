services:
  db:
    image: postgres:18-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: HZ5uiG6yQSRSXt
      POSTGRES_DB: pannagrobek
    ports:
      - "5432:5432"
    volumes:
      - ./db_data:/var/lib/postgresql
    networks:
      - api_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: adammazurek89@gmail.com
      PGADMIN_DEFAULT_PASSWORD: HZ5uiG6yQSRSXt
    ports:
      - "5050:80" # Panel będzie dostępny pod http://localhost:5050
    depends_on:
      - db
    volumes:
      - ./pgadmin_data:/var/lib/pgadmin
    networks:
      - api_network

  api:
    build: .
    container_name: fastapi_app_pannagrobek
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - .:/app # Mapowanie kodu z hosta do kontenera (dla --reload)
    environment:
      # Do aplikacji później correct_pass = secrets.compare_digest(credentials.password, os.getenv("API_PASS", "4vT%u$MtfDegHp"))    
      - DATABASE_URL=postgresql://postgres:HZ5uiG6yQSRSXt@db:5432/sprzatanie-nagrobkow
      - API_USER=pannagrobek
      - API_PASS=HZ5uiG6yQSRSXt
    depends_on:
      - db
    networks:
      - api_network

networks:
  api_network:
    driver: bridge
